<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Depoimentos Públicos - Atual Layout</title>
    <style>
      :root { color-scheme: light; }
      body { font-family: Arial, sans-serif; margin: 0; background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%); color: #0f172a; }
      .hero { background: linear-gradient(135deg, #0f172a, #2563eb); color: white; padding: 56px 20px; text-align: center; }
      .container { max-width: 1100px; margin: 0 auto; padding: 24px; }
      .back-link { display: inline-block; margin-bottom: 16px; color: #2563eb; text-decoration: none; font-weight: 700; }
      .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
      .card { background: white; border-radius: 20px; padding: 22px; box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08); border: 1px solid #e2e8f0; display: flex; flex-direction: column; gap: 12px; transition: transform .2s ease, box-shadow .2s ease; }
      .card:hover { transform: translateY(-4px); box-shadow: 0 16px 36px rgba(37, 99, 235, 0.15); }
      .card h3 { margin: 0; font-size: 1.1rem; }
      .badge { display: inline-flex; width: fit-content; align-items: center; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: #ecfeff; color: #0f766e; }
      .meta { color: #64748b; font-size: 14px; }
      .stars { color: #f59e0b; letter-spacing: 2px; font-size: 16px; }
      .message { line-height: 1.65; color: #334155; background: #f8fafc; padding: 12px; border-radius: 12px; }
      .photo { width: 100%; height: 220px; object-fit: cover; border-radius: 12px; background: #e2e8f0; display: block; }
      @media (max-width: 768px) {
        .photo { height: 200px; }
      }
      @media (max-width: 480px) {
        .photo { height: 180px; }
      }
      .empty { background: white; padding: 40px; border-radius: 16px; text-align: center; color: #64748b; }
      .pill-row { display: flex; gap: 8px; flex-wrap: wrap; }
    </style>
  </head>
  <body>
    <section class="hero">
      <img src="/img/logomarca.jpeg" alt="Logomarca Atual Layout" style="max-width:220px; width:100%; height:auto; border-radius:16px; box-shadow:0 10px 25px rgba(0,0,0,0.2); margin-bottom:16px; object-fit:contain; background:#fff; padding:10px;" />
      <h1>Depoimentos autorizados</h1>
      <p>Clientes que marcaram a opção de publicar aparecem aqui com destaque.</p>
    </section>
    <div class="container">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px;">
        <a class="back-link" href="/">← Voltar ao formulário</a>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <a href="/" aria-label="Formulário" style="display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:999px; background:#eff6ff; color:#2563eb; border:1px solid #bfdbfe; text-decoration:none;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h13A2.5 2.5 0 0 1 21 7.5v9A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z"></path>
              <path d="M7 9h10"></path>
              <path d="M7 13h6"></path>
            </svg>
          </a>
          <a href="/admin/login" aria-label="Área administrativa" style="display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:999px; background:#f8fafc; color:#475569; border:1px solid #cbd5e1; text-decoration:none;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4" width="18" height="14" rx="2"></rect>
              <path d="M7 8h10"></path>
              <path d="M7 12h6"></path>
            </svg>
          </a>
        </div>
      </div>
      <div id="content" class="card-grid"></div>
    </div>

    <script>
      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/\"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function renderStars(value) {
        const safeValue = Number(value) || 0;
        const filled = '★'.repeat(Math.max(0, Math.min(5, safeValue)));
        const empty = '☆'.repeat(Math.max(0, 5 - Math.max(0, Math.min(5, safeValue))));
        return `<span class="stars">${filled}${empty}</span>`;
      }

      async function loadTestimonials() {
        const content = document.getElementById('content');
        content.innerHTML = '<div class="empty">Carregando depoimentos...</div>';

        try {
          const response = await fetch('/api/testimonials');
          const testimonials = await response.json();

          if (!testimonials.length) {
            content.innerHTML = '<div class="empty">Nenhum depoimento autorizado foi encontrado ainda.</div>';
            return;
          }

          content.innerHTML = testimonials.map((item) => {
            const date = item.serviceDate ? new Date(item.serviceDate).toLocaleDateString('pt-BR') : 'Data não informada';
            const photo = Array.isArray(item.photoUrls) && item.photoUrls.length ? item.photoUrls[0] : '';
            const recommendBadge = item.recommend ? '<span class="badge">Recomendaria a Atual Layout</span>' : '<span class="badge">Cliente satisfeito</span>';
            return `
              <article class="card">
                ${recommendBadge}
                <h3>${escapeHtml(item.clientName || 'Cliente')}</h3>
                <div class="meta">${escapeHtml(item.city || '-')} • ${escapeHtml(date)}</div>
                <div class="pill-row">${renderStars(item.serviceRating)}</div>
                ${photo ? `<img class="photo" src="${escapeHtml(photo)}" alt="Foto do cliente ${escapeHtml(item.clientName || 'cliente')}" />` : ''}
                <div class="message">${escapeHtml(item.message || 'Depoimento disponível para publicação.')}</div>
              </article>
            `;
          }).join('');
        } catch (error) {
          content.innerHTML = '<div class="empty">Não foi possível carregar os depoimentos.</div>';
        }
      }

      loadTestimonials();
    </script>
  </body>
</html>
