<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Painel Admin - Atual Layout</title>
  <style>body{font-family:Arial,Helvetica,sans-serif;background:#f8fafc;color:#0f172a}.container{max-width:1100px;margin:24px auto}.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.06)}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:left}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap}header .actions{display:flex;gap:8px;flex-wrap:wrap}button{padding:10px 14px;border-radius:999px;border:none;background:#2563eb;color:#fff;cursor:pointer;font-weight:700}.btn-danger{background:#ef4444}.btn-secondary{background:#64748b}</style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1 style="margin:0;">Painel Administrativo</h1>
        <p style="margin:4px 0 0;color:#64748b;">Gerencie respostas, exporte dados e acompanhe o pós-venda.</p>
      </div>
      <div class="actions">
        <button id="backHome" class="btn-secondary">Voltar ao formulário</button>
        <button id="exportCsv">Exportar CSV</button>
        <button id="logout" class="btn-danger">Sair</button>
      </div>
    </header>
    <section class="card">
      <h2>Respostas</h2>
      <table>
        <thead><tr><th>Cliente</th><th>Data</th><th>Cidade</th><th>Nota</th><th>Mensagem</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
  </div>
  <script>
    async function load(){
      const res = await fetch('/api/admin/feedback');
      if (res.status===401) return location.href='/admin/login';
      const data = await res.json();
      const rows = document.getElementById('rows');
      rows.innerHTML = data.map(f=>`<tr><td>${f.clientName||'-'}</td><td>${f.serviceDate||'-'}</td><td>${f.city||'-'}</td><td>${f.serviceRating||'-'}</td><td>${(f.message||'').slice(0,80)}</td></tr>`).join('');
    }
    document.getElementById('logout').addEventListener('click', async ()=>{ await fetch('/admin/logout'); location.href='/admin/login'; });
    document.getElementById('backHome').addEventListener('click', ()=> location.href='/');
    document.getElementById('exportCsv').addEventListener('click', async ()=>{
      const res = await fetch('/api/admin/feedback/export');
      if (res.status === 401) return location.href = '/admin/login';
      const blob = await res.blob();
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'feedbacks.csv';
      document.body.appendChild(a);
      a.click();
      a.remove();
      window.URL.revokeObjectURL(url);
    });
    load();
  </script>
</body>
</html>
